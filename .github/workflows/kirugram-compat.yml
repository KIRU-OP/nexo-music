name: Kurigram 2.2.27 Compatibility Checks

on:
  pull_request:
    branches: [master]
    paths:
      - "nexo/**"
      - "config.py"
      - "requirements.txt"
      - "tests/**"
      - ".github/workflows/kirugram-compat.yml"
  push:
    branches: [master, migration/kirugram]

jobs:
  compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install Kurigram 2.2.27, PyTgCalls and test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install kurigram==2.2.27 "ntgcalls==2.2.5" "py-tgcalls==2.3.3" pytest
      - name: Compile NEXO Python files
        run: python -m compileall -q config.py nexo tests
      - name: Test Kurigram imports and PyTgCalls bridge
        run: python -m pytest -q tests/test_kirugram_compat.py
